databases:
  - name: reachinbox-db
    databaseName: scheduler
    user: postgres
    plan: free

services:
  # 1. Redis with noeviction (required for BullMQ queue stability)
  - type: redis
    name: reachinbox-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

  # 2. Backend API + Embedded BullMQ Worker (Runs on Render Free tier)
  - type: web
    name: reachinbox-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString

  # 3. Frontend Dashboard
  - type: web
    name: reachinbox-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reachinbox-api
          property: url
